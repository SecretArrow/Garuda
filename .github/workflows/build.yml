name: Motion Browser CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: motion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Unit Tests + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Lint + unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --parallel --build-cache --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --parallel --build-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Emulator Smoke Tests (install + launch + FATAL check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm && echo "KVM available"

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --parallel --stacktrace
            adb logcat -d | grep -q "FATAL EXCEPTION" && { adb logcat -d | grep -A 30 "FATAL EXCEPTION" | head -120; echo "FATAL EXCEPTION detected in logcat"; exit 1; } || echo "No FATAL EXCEPTION in logcat — app installed and ran cleanly"

      - name: Upload instrumented logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-logs
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore

  release:
    name: Release APK (split per ABI) + AAB
    runs-on: ubuntu-latest
    needs: [ quality ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Compute version (v* tag or 1.0.<run_number>)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "MOTION_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "MOTION_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building Motion Browser v${VER} (code ${GITHUB_RUN_NUMBER})"

      - name: Create ephemeral signing keystore
        run: |
          KS="$RUNNER_TEMP/motion-release.jks"
          keytool -genkeypair -v \
            -keystore "$KS" -alias motion \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass motion123 -keypass motion123 \
            -dname "CN=Motion Browser, OU=Motion, O=Motion, L=Jakarta, ST=Jakarta, C=ID"
          echo "MOTION_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "MOTION_KEYSTORE_PASSWORD=motion123" >> "$GITHUB_ENV"
          echo "MOTION_KEY_ALIAS=motion" >> "$GITHUB_ENV"
          echo "MOTION_KEY_PASSWORD=motion123" >> "$GITHUB_ENV"

      - name: Build release APK (per-ABI split + universal) and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --parallel --build-cache --stacktrace

      - name: Collect per-ABI APKs with clean release names
        run: |
          mkdir -p release-assets
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal*)   ABI="universal";;
              *arm64-v8a*)   ABI="arm64-v8a";;
              *armeabi-v7a*) ABI="armeabi-v7a";;
              *x86_64*)      ABI="x86_64";;
              *x86*)         ABI="x86";;
              *)             ABI="unknown";;
            esac
            cp "$f" "release-assets/MotionBrowser-v${MOTION_VERSION_NAME}-${ABI}.apk"
          done
          echo "Release assets:"
          ls -la release-assets/

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-x86
          path: app/build/outputs/apk/release/*x86*.apk
          if-no-files-found: error

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload per-ABI APKs (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: MotionBrowser-release-apks
          path: release-assets/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (per-ABI APKs)
    runs-on: ubuntu-latest
    needs: [ release, instrumented ]
    permissions:
      contents: write
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "MOTION_VERSION_NAME=$VER" >> "$GITHUB_ENV"

      - name: Download per-ABI APKs
        uses: actions/download-artifact@v4
        with:
          name: MotionBrowser-release-apks
          path: apks

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${MOTION_VERSION_NAME}"
          SHASH="$(git rev-parse --short HEAD)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Assets to publish:"
          ls -la apks/

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=""
            TITLE="Motion Browser $GITHUB_REF_NAME"
          else
            TAG="latest"
            PRERELEASE="--prerelease"
            TITLE="Motion Browser v${VER} (latest development build)"
          fi

          {
            echo "## Motion Browser v${VER}"
            echo ""
            echo "Build otomatis oleh CI dari commit ${SHASH} (${GITHUB_REF_NAME})."
            echo "Terverifikasi di emulator Android 14: install, launch, interaksi nyata, logcat bersih tanpa FATAL EXCEPTION."
            echo ""
            echo "### Unduh APK (split per-ABI)"
            echo ""
            echo "| File | Perangkat |"
            echo "|---|---|"
            echo "| MotionBrowser-v${VER}-arm64-v8a.apk | Ponsel modern 64-bit (2016+) — rekomendasi |"
            echo "| MotionBrowser-v${VER}-armeabi-v7a.apk | Ponsel 32-bit lama |"
            echo "| MotionBrowser-v${VER}-x86_64.apk | Emulator / Chromebook Intel 64-bit |"
            echo "| MotionBrowser-v${VER}-x86.apk | Perangkat Intel 32-bit |"
            echo "| MotionBrowser-v${VER}-universal.apk | Semua perangkat (ukuran terbesar) |"
            echo ""
            echo "Tidak yakin ABI perangkatmu? Pakai **arm64-v8a** (ponsel modern) atau **universal** (aman untuk semua)."
            echo ""
            echo "### Commit terakhir"
            echo ""
            git log --oneline -10 | sed 's/^/- /'
            echo ""
            echo "CI run: ${RUN_URL}"
          } > notes.md

          if [[ "$TAG" == "latest" ]]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" --target "$GITHUB_SHA" $PRERELEASE --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag $PRERELEASE --title "$TITLE" --notes-file notes.md \
              || gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
          fi

          gh release upload "$TAG" apks/*.apk --clobber
          gh release view "$TAG" --json tagName,assets --jq '.tagName + " -> " + ([.assets[].name] | join(", "))'
