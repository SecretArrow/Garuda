<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Garuda login test page</title></head>
<body style="font-family:sans-serif;padding:24px;max-width:420px">
  <h1>Acme Portal</h1>
  <form onsubmit="return doLogin(event)">
    <p><input id="user" name="user" type="text" placeholder="Username" style="width:100%;height:44px"></p>
    <p><input id="pass" name="pass" type="password" placeholder="Password" style="width:100%;height:44px"></p>
    <p><button id="login" type="submit" style="width:100%;height:48px">Log in</button></p>
  </form>
  <div id="result">no session</div>
  <script>
    function doLogin(e) {
      e.preventDefault();
      var u = document.getElementById('user').value;
      var p = document.getElementById('pass').value;
      if (u === 'garuda' && p === 'hunter2') {
        window.__loggedIn = true;
        document.getElementById('result').textContent = 'Welcome, Garuda!';
      } else {
        window.__loggedIn = false;
        document.getElementById('result').textContent = 'Invalid credentials';
      }
      return false;
    }
  </script>
</body>
</html>
